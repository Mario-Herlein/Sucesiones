<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Form input</title>
<link rel="stylesheet" href="_card.css">
<style>
.field { display:flex; flex-direction:column; gap:6px; max-width:320px; }
.field label { font-family:'Inter',sans-serif; font-size:13px; font-weight:500; color:#4A4A4A; }
.field input { font-family:'Inter',sans-serif; font-size:15px; padding:12px 16px; border:1px solid #E8E2D5; border-radius:8px; background:#FFF; color:#1A1A1A; outline:none; }
.field input:focus { border-color:#C8A24A; box-shadow: 0 0 0 3px rgba(200,162,74,0.18); }
.field--error input { border-color:#C0392B; }
.err { color:#C0392B; font-size:12px; }
</style>
</head><body class="card">
<div class="row" style="gap:18px">
  <div class="field"><label>Nombre</label><input type="text" value="Mariana"></div>
  <div class="field"><label>Email</label><input type="email" value="mariana@correo.com" autofocus></div>
  <div class="field field--error"><label>Teléfono</label><input type="tel" value=""><span class="err">Ingresá un teléfono para que te llamemos.</span></div>
</div>
</body></html>
