<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
.btn { font-family: 'Inter',sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.10em; padding: 15px 30px; border-radius: 50px; border: 0; cursor: pointer; }
.btn--primary { background:#C8A24A; color:#0A2540; }
.btn--primary:hover { background:#B8932F; }
.btn--secondary { background:transparent; color:#0A2540; border: 2px solid #0A2540; padding: 13px 28px; }
.btn--secondary:hover { background:#0A2540; color:#FFF; }
</style>
</head><body class="card">
<div class="row" style="gap:14px;align-items:center">
  <button class="btn btn--primary">Hablar con un abogado</button>
  <button class="btn btn--secondary">Ver servicios</button>
</div>
<div class="muted" style="font-size:13px;margin-top:14px;line-height:1.5">
  Primary: gold pill, navy text, 11/600/0.10em uppercase, 15×30 padding.<br>
  Secondary: 2px navy outline, transparent → fills navy on hover.
</div>
</body></html>
