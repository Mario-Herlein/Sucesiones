<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="_card.css">
<style>
.svc { background:#FFF; border-radius:12px; padding:28px; box-shadow:0 2px 8px rgba(10,37,64,0.06); width:300px; }
.svc:hover { box-shadow:0 8px 24px rgba(10,37,64,0.10); }
.num { font-family:'Fraunces',serif; font-weight:600; font-size:32px; color:#C8A24A; line-height:1; }
.svc h3 { font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:#0A2540; margin:14px 0 8px; }
.svc p { font-family:'Inter',sans-serif; font-size:14px; color:#4A4A4A; line-height:1.55; margin:0; }
</style>
</head><body class="card">
<div class="row" style="gap:20px">
  <div class="svc">
    <div class="num">01</div>
    <h3>Iniciamos la sucesión</h3>
    <p>Reunimos los documentos, presentamos el escrito y te avisamos cuando el juzgado abre el expediente.</p>
  </div>
  <div class="svc">
    <div class="num">02</div>
    <h3>Declaratoria de herederos</h3>
    <p>La sentencia que te reconoce como heredero. La gestionamos nosotros, sin que tengas que ir al juzgado.</p>
  </div>
</div>
</body></html>
