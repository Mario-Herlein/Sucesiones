<!doctype html><html lang="es"><head>
<meta charset="utf-8"><title>Semantic & utility</title>
<link rel="stylesheet" href="_card.css">
</head><body class="card">
<div class="row">
  <div class="sw"><div class="chip" style="background:#25D366"></div><div class="meta"><span class="name">WhatsApp</span><span class="hex">#25D366 · WA button only</span></div></div>
  <div class="sw"><div class="chip" style="background:#C0392B"></div><div class="meta"><span class="name">Error</span><span class="hex">#C0392B · form errors</span></div></div>
  <div class="sw"><div class="chip" style="background:#0A2540"></div><div class="meta"><span class="name">Emphasis bg</span><span class="hex">--navy-deep</span></div></div>
  <div class="sw"><div class="chip" style="background:#E8D9B0"></div><div class="meta"><span class="name">Subtle bg</span><span class="hex">--gold-soft</span></div></div>
</div>
<div style="margin-top:16px;font-size:13px;color:#4A4A4A;line-height:1.5">
  Gold is an accent only — never a large flat fill. WhatsApp green is reserved for the WhatsApp button. One primary CTA per visible screen.
</div>
</body></html>
