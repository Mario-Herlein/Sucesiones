  <style>
/* ============================================================
   Saucedo & Asociados — Landing Sucesiones
   Color & Type Tokens
   ============================================================ */

/* ------- Fonts (Google Fonts) ------- */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

:root {
  /* ===== Color tokens ===== */
  --navy-deep:  #0A2540;   /* primary backgrounds (header, footer, emphasis sections) */
  --navy-soft:  #1B3A5C;   /* hover states, secondary elements */
  --gold:       #C8A24A;   /* accent only — decorative lines, step numbers, 1 CTA per screen */
  --gold-soft:  #E8D9B0;   /* subtle section backgrounds for differentiation */
  --off-white:  #FAFAF7;   /* general page background */
  --white:      #FFFFFF;   /* cards, form containers */
  --ink:        #1A1A1A;   /* primary body text */
  --ink-soft:   #4A4A4A;   /* secondary text, long paragraphs */
  --whatsapp:   #25D366;   /* ONLY for WhatsApp buttons */
  --border:     #E8E2D5;   /* subtle borders and dividers */
  --red:        #C0392B;   /* error states */

  /* ===== Semantic color aliases ===== */
  --bg:           var(--off-white);
  --bg-card:      var(--white);
  --bg-emphasis:  var(--navy-deep);
  --bg-subtle:    var(--gold-soft);
  --fg:           var(--ink);
  --fg-soft:      var(--ink-soft);
  --fg-on-dark:   var(--white);
  --accent:       var(--gold);
  --rule:         var(--border);

  /* ===== Type families ===== */
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* ===== Type scale — desktop ===== */
  --fs-h1:      56px;
  --fs-h2:      40px;
  --fs-h3:      24px;
  --fs-body:    17px;
  --fs-caption: 14px;
  --fs-small:   13px;

  --lh-h1:   1.1;
  --lh-h2:   1.2;
  --lh-h3:   1.3;
  --lh-body: 1.6;

  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;

  --tracking-eyebrow: 0.08em;
  --tracking-button:  0.10em;

  /* ===== Spacing scale ===== */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  24px;
  --space-6:  32px;
  --space-7:  48px;
  --space-8:  64px;
  --space-9:  80px;
  --space-10: 120px;

  /* ===== Layout ===== */
  --container-max: 1200px;
  --gutter: 24px;
  --section-py: 80px;

  /* ===== Radii ===== */
  --radius-sm:   8px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --radius-pill: 50px;

  /* ===== Elevation / shadows ===== */
  --shadow-card:       0 2px 8px rgba(10, 37, 64, 0.06);
  --shadow-card-hover: 0 8px 24px rgba(10, 37, 64, 0.10);
  --shadow-deep:       0 12px 40px rgba(10, 37, 64, 0.16);

  /* ===== Motion ===== */
  --ease-standard: cubic-bezier(0.2, 0.6, 0.2, 1);
  --dur-fast: 140ms;
  --dur-base: 220ms;
  --dur-slow: 400ms;
}

@media (max-width: 640px) {
  :root {
    --fs-h1: 32px;
    --fs-h2: 26px;
    --fs-h3: 20px;
    --fs-body: 16px;
    --gutter: 16px;
    --section-py: 48px;
  }
}

/* ============================================================
   Base element styles (semantic)
   ============================================================ */

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-weight: var(--fw-regular);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3 {
  font-family: var(--font-display);
  color: var(--fg);
  margin: 0 0 var(--space-4);
  font-weight: var(--fw-semibold);
  text-wrap: pretty;
}

h1 { font-size: var(--fs-h1); line-height: var(--lh-h1); letter-spacing: -0.01em; }
h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); letter-spacing: -0.005em; }
h3 { font-size: var(--fs-h3); line-height: var(--lh-h3); }

p { margin: 0 0 var(--space-4); color: var(--fg); text-wrap: pretty; }
p.lead { color: var(--fg-soft); font-size: 19px; }

/* Eyebrow / caption */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-caption);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-eyebrow);
  text-transform: uppercase;
  color: var(--accent);
}

a { color: var(--navy-deep); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--navy-soft); }

hr.rule-gold {
  border: 0;
  height: 2px;
  width: 48px;
  background: var(--gold);
  margin: 0 0 var(--space-5);
}

/* Container */
.container {
  max-width: var(--container-max);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

/* Section spacing */
.section { padding-block: var(--section-py); }
.section--navy { background: var(--navy-deep); color: var(--fg-on-dark); }
.section--navy h1, .section--navy h2, .section--navy h3 { color: var(--fg-on-dark); }
.section--navy p { color: rgba(255,255,255,0.82); }
.section--gold-soft { background: var(--gold-soft); }


/* ===== Landing styles ===== */

/* Landing-Sucesiones page styles. Imports tokens from the system root. */
html, body { margin: 0; }
body {
  background: var(--off-white);
}

/* ---------- shared ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font-body); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.10em;
  padding: 15px 30px; border-radius: 50px; border: 0;
  cursor: pointer; transition: background var(--dur-base) var(--ease-standard), color var(--dur-base) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard);
  text-decoration: none;
}
.btn--primary { background: var(--gold); color: var(--navy-deep); }
.btn--primary:hover { background: #B8932F; }
.btn--secondary { background: transparent; color: var(--navy-deep); border: 2px solid var(--navy-deep); padding: 13px 28px; }
.btn--secondary:hover { background: var(--navy-deep); color: var(--white); }
.btn--secondary--light { color: var(--white); border-color: rgba(255,255,255,0.7); }
.btn--secondary--light:hover { background: var(--white); color: var(--navy-deep); border-color: var(--white); }
.btn--whatsapp { background: var(--whatsapp); color: var(--white); padding: 14px 24px; box-shadow: 0 4px 14px rgba(37,211,102,0.30); }
.btn--whatsapp:hover { background: #1EB955; }

.eyebrow {
  font-family: var(--font-body); font-size: var(--fs-caption); font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold);
  margin-bottom: 12px;
}
.rule-gold { border: 0; height: 2px; width: 48px; background: var(--gold); margin: 0 0 24px; }

.section { padding-block: var(--section-py); }
.section--navy { background: var(--navy-deep); color: var(--white); }
.section--navy h1, .section--navy h2, .section--navy h3 { color: var(--white); }
/* Defuse text-wrap: pretty engine height-miscount that was leaving wrapped 2nd lines overflowing onto sibling text. */
h1, h2, h3, h4, h5, h6 { text-wrap: initial; }
.section--navy p { color: rgba(255,255,255,0.78); }
.section--gold-soft { background: var(--gold-soft); }
.container { max-width: var(--container-max); margin-inline: auto; padding-inline: var(--gutter); }

/* ---------- Header ---------- */
.hdr {
  position: sticky; top: 0; z-index: 50;
  background: rgba(250,250,247,0.92);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border);
}
.hdr__inner { display: flex; align-items: center; justify-content: space-between; height: 76px; }
.hdr__logo img { height: 40px; display: block; }
.hdr__nav { display: flex; align-items: center; gap: 28px; }
.hdr__nav a { font-family: var(--font-body); font-size: 14px; color: var(--ink); text-decoration: none; font-weight: 500; }
.hdr__nav a:hover { color: var(--navy-soft); }
.hdr__right { display: flex; align-items: center; gap: 16px; }
.hdr__phone { font-family: var(--font-body); font-size: 14px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; text-decoration: none; }
.hdr__phone:hover { color: var(--gold); }
.hdr__wa-btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.10em; padding: 11px 18px; border-radius: 50px; background: var(--whatsapp); color: var(--white); text-decoration: none; transition: background var(--dur-base) var(--ease-standard); }
.hdr__wa-btn:hover { background: #1EB955; color: var(--white); }
.hdr__hamburger { display: none; background: transparent; border: 0; color: var(--ink); cursor: pointer; padding: 6px; }
@media (max-width: 900px) { .hdr__nav { display: none; } .hdr__phone { display: none; } .hdr__hamburger { display: inline-flex; } }
.hdr__sheet { position: fixed; inset: 76px 0 0 0; background: var(--off-white); z-index: 49; padding: 24px var(--gutter); display: none; }
.hdr__sheet.open { display: block; }
.hdr__sheet a { display: block; padding: 14px 0; border-bottom: 1px solid var(--border); font-family: var(--font-body); font-size: 17px; color: var(--ink); text-decoration: none; font-weight: 500; }

/* ---------- Hero form (in-hero contact card) ---------- */
.hero__grid--form { grid-template-columns: 1.05fr 0.95fr; gap: 56px; }
.hero-form-card { background: var(--white); border-radius: 16px; padding: 32px; box-shadow: var(--shadow-deep); border: 1px solid var(--border); }
.hero-form-card h3 { font-family: var(--font-display); color: var(--navy-deep); font-weight: 600; font-size: 24px; margin: 0 0 4px; }
.hero-form-card .sub { font-size: 14px; color: var(--ink-soft); margin: 0 0 20px; }
.hero-form-card .legal { font-size: 12px; color: var(--ink-soft); margin: 14px 0 0; line-height: 1.5; display: inline-flex; align-items: center; gap: 6px; }
.hero-form-card .legal .ico { color: var(--gold); }
.hero__micro { font-size: 13px; color: var(--ink-soft); margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; }
.hero__micro .dot { color: var(--gold); }

/* ---------- Pain points ---------- */
.pain-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.pain { background: var(--white); border-radius: 12px; padding: 28px; border: 1px solid var(--border); transition: box-shadow var(--dur-base) var(--ease-standard), border-color var(--dur-base) var(--ease-standard); }
.pain:hover { box-shadow: var(--shadow-card); border-color: var(--gold); }
.pain__ico { color: var(--navy-deep); margin-bottom: 16px; }
.pain h3 { font-family: var(--font-display); font-size: 18px; color: var(--navy-deep); font-weight: 600; margin: 0 0 8px; line-height: 1.3; }
.pain p { font-size: 14px; color: var(--ink-soft); line-height: 1.55; margin: 0; }
@media (max-width: 900px) { .pain-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .pain-grid { grid-template-columns: 1fr; } }

/* ---------- Services link ---------- */
.svc__link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--navy-deep); text-decoration: none; margin-top: 20px; letter-spacing: 0.04em; text-transform: uppercase; }
.svc__link:hover { color: var(--gold); }
.svc__link .arrow { transition: transform var(--dur-base) var(--ease-standard); }
.svc__link:hover .arrow { transform: translateX(3px); }
.svc-grid--5 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 900px) { .svc-grid--5 { grid-template-columns: 1fr; } }

/* ---------- Process steps with time estimates ---------- */
.steps--5 { grid-template-columns: repeat(5, 1fr); gap: 16px; }
.step__time { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
.steps__footer { margin-top: 32px; font-size: 14px; color: rgba(255,255,255,0.7); text-align: center; }
@media (max-width: 1100px) { .steps--5 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .steps--5 { grid-template-columns: 1fr; } }

/* ---------- Transparent fees ---------- */
.fees-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px; }
.fee { background: var(--white); border-radius: 12px; padding: 32px; box-shadow: var(--shadow-card); }
.fee__ico { color: var(--gold); margin-bottom: 16px; }
.fee h3 { font-family: var(--font-display); font-size: 22px; color: var(--navy-deep); font-weight: 600; margin: 0 0 10px; }
.fee p { font-size: 15px; color: var(--ink-soft); line-height: 1.6; margin: 0; }
.fees__cta { text-align: center; }
.btn--navy { background: var(--navy-deep); color: var(--white); }
.btn--navy:hover { background: var(--navy-soft); }
@media (max-width: 900px) { .fees-grid { grid-template-columns: 1fr; } }

/* ---------- Testimonials ---------- */
.tst-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.tst { background: var(--white); border-radius: 12px; padding: 28px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 14px; }
.tst__stars { display: inline-flex; gap: 2px; color: var(--gold); }
.tst__quote { font-size: 16px; line-height: 1.6; color: var(--ink); margin: 0; flex: 1; }
.tst__meta { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
.tst__name { font-weight: 600; color: var(--navy-deep); font-size: 14px; }
.tst__date { font-size: 12px; color: var(--ink-soft); }
.tst__google { text-align: center; margin-top: 32px; }
.tst__google a { color: var(--navy-deep); font-weight: 500; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.tst__google a:hover { color: var(--gold); }
@media (max-width: 800px) { .tst-grid { grid-template-columns: 1fr; } }

/* ---------- Final CTA ---------- */
.fcta { text-align: center; }
.fcta h2 { font-size: 48px; color: var(--white); margin-bottom: 16px; }
.fcta p { color: rgba(255,255,255,0.78); font-size: 18px; max-width: 560px; margin: 0 auto 32px; }
.fcta__buttons { display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
.fcta__contact { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; padding-top: 32px; border-top: 1px solid rgba(255,255,255,0.10); }
.fcta__contact-item { display: inline-flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.86); font-size: 14px; }
.fcta__contact-item .ico { color: var(--gold); }
.fcta__contact-item a { color: inherit; text-decoration: none; }
.fcta__contact-item a:hover { color: var(--gold); }
@media (max-width: 700px) { .fcta h2 { font-size: 32px; } .fcta p { font-size: 16px; } }

/* ---------- Sticky mobile CTA ---------- */
.sticky-mobile {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
  background: var(--white); border-top: 1px solid var(--border);
  padding: 12px 16px; display: none; gap: 10px;
  box-shadow: 0 -8px 24px rgba(10,37,64,0.10);
  transform: translateY(100%); transition: transform var(--dur-base) var(--ease-standard);
}
.sticky-mobile.is-visible { transform: translateY(0); }
.sticky-mobile .btn { flex: 1; padding: 14px 14px; font-size: 11px; }
@media (max-width: 800px) {
  .sticky-mobile { display: flex; }
  .sticky-wa { bottom: 84px; }
}

/* ---------- Footer additions ---------- */
.ft__social { display: flex; gap: 12px; margin-top: 16px; }
.ft__social a { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.86); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: background var(--dur-base) var(--ease-standard), color var(--dur-base) var(--ease-standard); }
.ft__social a:hover { background: var(--gold); color: var(--navy-deep); }
.ft__contact-line { font-size: 14px; color: rgba(255,255,255,0.74); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ft__contact-line a { color: inherit; text-decoration: none; }
.ft__contact-line a:hover { color: var(--white); }
.ft__contact-line .ico { color: var(--gold); flex-shrink: 0; }

/* ---------- Hero ---------- */
.hero { padding-top: 64px; padding-bottom: 80px; }
.hero__grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 64px; align-items: center; }
.hero h1 { font-family: var(--font-display); font-size: 56px; line-height: 1.15; letter-spacing: -0.01em; color: var(--navy-deep); font-weight: 600; margin: 0 0 20px; text-wrap: initial; }
.hero h1 em { display: block; font-style: italic; color: var(--gold); font-weight: 500; margin-top: 6px; }
.hero .lead { font-family: var(--font-body); font-size: 19px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 32px; max-width: 520px; }
.hero__ctas { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.hero__ctas .ghost { font-size: 14px; color: var(--ink-soft); margin-left: 8px; }
.hero__photo {
  aspect-ratio: 4/5;
  border-radius: 16px;
  background:
    linear-gradient(180deg, rgba(10,37,64,0.10), rgba(10,37,64,0.30)),
    repeating-linear-gradient(135deg, #d6cdb5 0 2px, #e3dac4 2px 12px);
  position: relative;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(10,37,64,0.18);
}
.hero__photo .ph-tag {
  position: absolute; left: 16px; bottom: 16px;
  background: rgba(250,250,247,0.9); padding: 6px 12px; border-radius: 50px;
  font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft);
}
@media (max-width: 900px) {
  .hero__grid { grid-template-columns: 1fr; gap: 36px; }
  .hero h1 { font-size: 32px; }
  .hero .lead { font-size: 16px; }
}

/* ---------- TrustBar ---------- */
.trust {
  background: var(--white);
  border-block: 1px solid var(--border);
  padding-block: 36px;
}
.trust__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; align-items: center; }
.trust__item { display: flex; flex-direction: column; gap: 4px; }
.trust__num { font-family: var(--font-display); font-weight: 600; font-size: 36px; line-height: 1; color: var(--navy-deep); }
.trust__num .acc { color: var(--gold); }
.trust__lbl { font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
@media (max-width: 800px) { .trust__grid { grid-template-columns: repeat(2, 1fr); gap: 24px; } }

/* ---------- Section headings ---------- */
.shead { max-width: 720px; margin-bottom: 48px; }
.shead h2 { font-family: var(--font-display); font-size: 40px; line-height: 1.2; color: var(--navy-deep); font-weight: 600; margin: 0 0 14px; letter-spacing: -0.005em; }
.section--navy .shead h2 { color: var(--white); }
.shead p { font-size: 17px; color: var(--ink-soft); line-height: 1.6; margin: 0; }
.section--navy .shead p { color: rgba(255,255,255,0.78); }
@media (max-width: 700px) { .shead h2 { font-size: 26px; } }

/* ---------- Process steps ---------- */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.step { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; padding: 28px; }
.step__num { font-family: var(--font-display); font-weight: 600; font-size: 32px; color: var(--gold); line-height: 1; margin-bottom: 14px; }
.step h3 { font-family: var(--font-display); font-size: 20px; color: var(--white); font-weight: 600; margin: 0 0 8px; }
.step p { font-size: 14px; color: rgba(255,255,255,0.74); line-height: 1.55; margin: 0; }
@media (max-width: 900px) { .steps { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .steps { grid-template-columns: 1fr; } }

/* ---------- Services ---------- */
.svc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.svc { background: var(--white); border-radius: 12px; padding: 32px; box-shadow: var(--shadow-card); transition: box-shadow var(--dur-base) var(--ease-standard); }
.svc:hover { box-shadow: var(--shadow-card-hover); }
.svc__icon { width: 44px; height: 44px; color: var(--navy-deep); margin-bottom: 18px; }
.svc h3 { font-family: var(--font-display); font-size: 22px; color: var(--navy-deep); font-weight: 600; margin: 0 0 10px; }
.svc p { font-size: 15px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 18px; }
.svc ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.svc li { font-size: 14px; color: var(--ink); display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; }
.svc li::before { content: ''; flex-shrink: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-top: 8px; }
@media (max-width: 900px) { .svc-grid { grid-template-columns: 1fr; } }

/* ---------- Lawyer bio ---------- */
.bio__grid { display: grid; grid-template-columns: 320px 1fr; gap: 56px; align-items: center; }
.bio__photo {
  aspect-ratio: 4/5;
  border-radius: 12px;
  background:
    linear-gradient(180deg, rgba(10,37,64,0.05), rgba(10,37,64,0.25)),
    repeating-linear-gradient(135deg, #cfc6b0 0 2px, #ddd3bd 2px 14px);
  position: relative;
  overflow: hidden;
}
.bio h2 { margin-top: 0; }
.bio__credentials { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }
.bio__cred { display: flex; gap: 14px; align-items: flex-start; }
.bio__cred .ico { color: var(--gold); flex-shrink: 0; margin-top: 2px; }
.bio__cred .t { font-weight: 600; color: var(--ink); font-size: 15px; line-height: 1.4; }
.bio__cred .s { font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
@media (max-width: 800px) { .bio__grid { grid-template-columns: 1fr; gap: 28px; } .bio__photo { max-width: 280px; } }

/* ---------- FAQ ---------- */
.faq__list { max-width: 800px; margin: 0 auto; }
.faq__item { border-bottom: 1px solid var(--border); }
.faq__q {
  width: 100%; background: transparent; border: 0; padding: 22px 0;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  font-family: var(--font-body); font-size: 17px; color: var(--ink); text-align: left; cursor: pointer; font-weight: 500;
}
.faq__item.is-open .faq__q { font-weight: 600; }
.faq__ico { color: var(--gold); font-size: 22px; font-weight: 500; transition: transform var(--dur-base) var(--ease-standard); }
.faq__a { max-height: 0; overflow: hidden; transition: max-height var(--dur-slow) var(--ease-standard); }
.faq__item.is-open .faq__a { max-height: 400px; }
.faq__a-inner { padding: 0 0 22px; color: var(--ink-soft); font-size: 16px; line-height: 1.6; max-width: 680px; }

/* ---------- Form ---------- */
.contact__grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 64px; align-items: start; }
.contact__copy h2 { color: var(--white); }
.contact__copy p { color: rgba(255,255,255,0.78); margin-bottom: 24px; }
.contact__chan { display: flex; flex-direction: column; gap: 14px; margin-top: 32px; }
.contact__chan-item { display: flex; gap: 14px; align-items: center; color: rgba(255,255,255,0.92); font-size: 15px; }
.contact__chan-item .ico { color: var(--gold); }
.contact__chan-item a { color: inherit; text-decoration: none; }
.contact__chan-item a:hover { color: var(--gold); }

.form-card { background: var(--white); border-radius: 12px; padding: 36px; box-shadow: var(--shadow-deep); }
.form-card h3 { font-family: var(--font-display); color: var(--navy-deep); font-weight: 600; font-size: 22px; margin: 0 0 6px; }
.form-card .sub { font-size: 14px; color: var(--ink-soft); margin: 0 0 22px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label { font-size: 13px; font-weight: 500; color: var(--ink-soft); }
.field input, .field select, .field textarea {
  font-family: var(--font-body); font-size: 15px;
  padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--white); color: var(--ink); outline: none;
  transition: border-color var(--dur-base) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard);
}
.field textarea { resize: vertical; min-height: 88px; font-family: var(--font-body); }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,162,74,0.18); }
.field--err input, .field--err select, .field--err textarea { border-color: var(--red); }
.field__err { color: var(--red); font-size: 12px; margin-top: 4px; }
.form-card .submit-row { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
.form-card .legal { font-size: 12px; color: var(--ink-soft); margin: 14px 0 0; line-height: 1.5; }

.form-success {
  text-align: center; padding: 24px 0;
}
.form-success .badge {
  width: 56px; height: 56px; border-radius: 50%; background: var(--gold-soft);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--navy-deep); margin-bottom: 16px;
}
.form-success h3 { margin-bottom: 8px; }

@media (max-width: 900px) {
  .contact__grid { grid-template-columns: 1fr; gap: 32px; }
  .form-card { padding: 24px; }
}

/* ---------- Footer ---------- */
.ft { background: #061b30; color: rgba(255,255,255,0.74); padding-block: 56px 32px; }
.ft__grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 48px; }
.ft__logo img { height: 40px; }
.ft__col h4 { font-family: var(--font-body); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin: 0 0 16px; }
.ft__col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ft__col a { color: rgba(255,255,255,0.74); text-decoration: none; font-size: 14px; }
.ft__col a:hover { color: var(--white); }
.ft__col p { font-size: 14px; color: rgba(255,255,255,0.74); margin: 0; line-height: 1.6; }
.ft__legal { border-top: 1px solid rgba(255,255,255,0.10); padding-top: 24px; margin-top: 40px; font-size: 12px; color: rgba(255,255,255,0.55); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.ft__about { color: rgba(255,255,255,0.74); font-size: 14px; margin-top: 16px; line-height: 1.6; max-width: 280px; }
@media (max-width: 800px) { .ft__grid { grid-template-columns: 1fr 1fr; gap: 32px; } }

/* Hero — 60/40 split: headline + CTAs left, contact form card right. */
(function () {
  const { useState } = React;
  const Icon = window.Icon;

  function HeroForm() {
    const [form, setForm] = useState({ nombre: '', telefono: '', email: '', situacion: 'inmueble', mensaje: '' });
    const [errors, setErrors] = useState({});
    const [submitted, setSubmitted] = useState(false);
    const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

    const onSubmit = (e) => {
      e.preventDefault();
      const errs = {};
      if (!form.nombre.trim()) errs.nombre = 'Decinos cómo te llamás.';
      if (!form.telefono.trim()) errs.telefono = 'Necesitamos un teléfono o WhatsApp.';
      if (!form.email.trim()) errs.email = 'Dejanos un email para responderte.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) errs.email = 'Revisá el email.';
      setErrors(errs);
      if (Object.keys(errs).length === 0) setSubmitted(true);
    };

    if (submitted) {
      return (
        <div className="hero-form-card">
          <div className="form-success">
            <div className="badge"><Icon name="check-circle" size={28} /></div>
            <h3>Recibimos tu consulta.</h3>
            <p style={{color:'var(--ink-soft)', margin:'0 0 18px'}}>Te respondemos hoy mismo. Si es urgente, escribinos por WhatsApp.</p>
            <a className="btn btn--whatsapp" href="https://wa.me/5491141664386">
              <Icon name="whatsapp" size={18} /> Escribir por WhatsApp
            </a>
          </div>
        </div>
      );
    }
    return (
      <form className="hero-form-card" onSubmit={onSubmit} noValidate>
        <h3>Contanos tu caso</h3>
        <p className="sub">Te respondemos hoy.</p>
        <div className={`field ${errors.nombre ? 'field--err' : ''}`}>
          <label htmlFor="hf-n">Nombre y apellido</label>
          <input id="hf-n" type="text" value={form.nombre} onChange={set('nombre')} placeholder="Mariana López" />
          {errors.nombre && <span className="field__err">{errors.nombre}</span>}
        </div>
        <div className={`field ${errors.telefono ? 'field--err' : ''}`}>
          <label htmlFor="hf-t">Teléfono / WhatsApp</label>
          <input id="hf-t" type="tel" value={form.telefono} onChange={set('telefono')} placeholder="11 4166-4386" />
          {errors.telefono && <span className="field__err">{errors.telefono}</span>}
        </div>
        <div className={`field ${errors.email ? 'field--err' : ''}`}>
          <label htmlFor="hf-e">Email</label>
          <input id="hf-e" type="email" value={form.email} onChange={set('email')} placeholder="mariana@correo.com" />
          {errors.email && <span className="field__err">{errors.email}</span>}
        </div>
        <div className="field">
          <label htmlFor="hf-s">¿Qué tipo de consulta es?</label>
          <select id="hf-s" value={form.situacion} onChange={set('situacion')}>
            <option value="inmueble">Heredé un inmueble y quiero venderlo</option>
            <option value="iniciar">Necesito iniciar una sucesión</option>
            <option value="conflicto">Hay conflicto entre herederos</option>
            <option value="testamento">Sucesión con testamento</option>
            <option value="patrimonio">Quiero ordenar mi patrimonio en vida</option>
            <option value="otra">Otra consulta</option>
          </select>
        </div>
        <div className="field">
          <label htmlFor="hf-m">Comentario breve <span style={{color:'#9a9a9a'}}>(opcional)</span></label>
          <textarea id="hf-m" rows="3" value={form.mensaje} onChange={set('mensaje')} placeholder="Mi papá falleció hace dos meses..." />
        </div>
        <button type="submit" className="btn btn--primary" style={{width:'100%'}}>
          Enviar consulta
        </button>
        <span className="legal">
          <span className="ico"><Icon name="lock" size={14} /></span>
          Tu información es confidencial. Cubierta por secreto profesional.
        </span>
      </form>
    );
  }

  function Hero() {
    return (
      <section className="hero">
        <div className="container hero__grid hero__grid--form">
          <div>
            <div className="eyebrow">Estudio jurídico · CABA y GBA</div>
            <hr className="rule-gold" />
            <h1>
              Sucesiones resueltas con claridad,
              <em>no con sorpresas.</em>
            </h1>
            <p className="lead">
              Tramitamos tu juicio sucesorio con presupuesto cerrado, plazos comprometidos
              y el acompañamiento que el momento merece. Especialistas en CABA y Buenos Aires.
            </p>
            <div className="hero__ctas">
              <a className="btn btn--primary" href="#contacto">Iniciar mi consulta</a>
              <a className="btn btn--secondary" href="https://wa.me/5491141664386" target="_blank" rel="noopener">
                <Icon name="whatsapp" size={14} /> Hablar por WhatsApp
              </a>
            </div>
            <div className="hero__micro">
              <span className="dot">●</span>
              Primera consulta sin cargo · Respuesta en menos de 24hs hábiles
            </div>
          </div>
          <HeroForm />
        </div>

        a: 'Sí, con planificación. Una vez obtenida la declaratoria de herederos podés escriturar mediante "tracto abreviado" sin esperar la inscripción. Lo coordinamos con el escribano para que llegues a la firma en el menor tiempo posible.' },
      { q: '¿Qué pasa si no todos los herederos están de acuerdo?',

      { q: '¿Qué es el impuesto a la transmisión gratuita de bienes y cuándo aplica?',
        a: 'Es un impuesto provincial sobre las herencias. En Provincia de Buenos Aires aplica cuando lo recibido supera ciertos topes; en CABA actualmente no se cobra. En la primera reunión calculamos si corresponde y cuánto sería en tu caso.' },
      { q: '¿Qué pasa si hay un heredero que vive en el exterior?',

/* StickyMobileCTA — bottom-fixed bar mobile only, appears after hero */
(function () {
  const { useState, useEffect } = React;
  const Icon = window.Icon;
  function StickyMobileCTA() {
    const [show, setShow] = useState(false);
    useEffect(() => {
      const onScroll = () => setShow(window.scrollY > 600);
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
      return () => window.removeEventListener('scroll', onScroll);
    }, []);
    return (
      <div className={`sticky-mobile ${show ? 'is-visible' : ''}`}>
        <a className="btn btn--secondary" href="#contacto">Consultar</a>
        <a className="btn btn--whatsapp" href="https://wa.me/5491141664386" target="_blank" rel="noopener">
          <Icon name="whatsapp" size={14} /> WhatsApp
        </a>
      </div>
    );
  }
  window.StickyMobileCTA = StickyMobileCTA;
})();
